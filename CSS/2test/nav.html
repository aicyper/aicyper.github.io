<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네비게이션 기본 · 수평 · 수직 정리</title>
<style>
:root{
  --ink:#101314;
  --paper:#eef0ea;
  --paper-2:#e2e5da;
  --line:#c9cdbd;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --sans:"IBM Plex Sans","Segoe UI",sans-serif;
  --accent:#4d7ea8;
  --accent-fill:#4d7ea830;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.6;
}
.wrap{ max-width:760px; margin:0 auto; padding:64px 24px 100px; }

.eyebrow{ font-family:var(--mono); font-size:13px; color:#6b7060; margin:0 0 14px; }
h1{ font-size:clamp(32px,6vw,46px); margin:0 0 16px; letter-spacing:-0.02em; }
h1 span{ color:var(--accent); }
p.lede{ max-width:56ch; color:#40453c; font-size:16px; margin:0 0 48px; }

section{ margin-bottom:56px; }
h2{ font-size:20px; margin:0 0 10px; }
p{ font-size:15px; color:#333; }
code.inline{
  font-family:var(--mono);
  background:var(--paper-2);
  padding:2px 6px;
  border:1px solid var(--line);
  font-size:0.9em;
}

.demo-pane{
  background:var(--paper-2);
  border:1px solid var(--line);
  padding:20px;
}

/* 공통 nav 리셋 */
nav ul{
  list-style:none;
  margin:0; padding:0;
}
nav a{
  text-decoration:none;
  color:var(--ink);
  font-family:var(--sans);
  font-size:14.5px;
}

/* 기본(리셋 전) nav */
.nav-raw ul{
  list-style:disc;
  padding-left:20px;
}
.nav-raw a{ color:#1a56db; text-decoration:underline; }

/* 수평 nav */
.nav-horizontal ul{
  display:flex;
  gap:24px;
  background:#fff;
  border:1px solid var(--line);
  padding:14px 20px;
}
.nav-horizontal a:hover{ color:var(--accent); }

/* 수직 nav */
.nav-vertical ul{
  display:flex;
  flex-direction:column;
  width:180px;
  background:#fff;
  border:1px solid var(--line);
}
.nav-vertical li{ border-bottom:1px solid var(--line); }
.nav-vertical li:last-child{ border-bottom:none; }
.nav-vertical a{
  display:block;
  padding:12px 18px;
}
.nav-vertical a:hover{ background:var(--accent-fill); color:#1d3b4a; }
</style>
</head>

<body>
<div class="wrap">
  <p class="eyebrow">HTML / CSS NAVIGATION</p>
  <h1><span>nav</span> 기본과 수평·수직 정리</h1>
  <p class="lede"><code class="inline">&lt;nav&gt;</code>는 링크 목록을 의미론적으로 묶는 태그일 뿐, 화면에 가로로 놓을지 세로로 놓을지는 CSS의 <code class="inline">flex-direction</code>으로 결정한다.</p>

  <section>
    <h2>기본 구조</h2>
    <div class="demo-pane nav-raw">
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </section>

  <section>
    <h2>수평(가로) 네비게이션</h2>
    <div class="demo-pane nav-horizontal">
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </section>

  <section>
    <h2>수직(세로) 네비게이션</h2>
    <div class="demo-pane nav-vertical">
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </section>

</div>
</body>
</html>
