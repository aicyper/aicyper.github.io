<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width:100px;
            height:100px;
            border:10px solid red;
            background-color:white;
            position:relative;
            animation: color 5s infinite;
        }


        @keyframes color {
            0% {border:2px solid red; left: 0px; top: 0px;}
            25% {border:5px solid green; left: 200px; top: 0px;}
            50% {border:2px solid blue; left: 200px; top: 200px;}
            75% {border:5px solid yellow; left: 0px; top: 200px;}
            100% {border:2px solid red; left: 0px; top: 0px;}
        }
    </style>
</head>
<body>
    <div class="box">신기하다</div>
</body>
</html>
