<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript Math 메소드 알아보기</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            color: #17233b;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
        }

        main {
            width: min(100%, 1100px);
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.7rem, 4vw, 2.4rem);
        }

        header p {
            margin: 0;
            color: #52617a;
            line-height: 1.7;
        }

        .section-title {
            margin: 30px 0 14px;
            font-size: 1.35rem;
        }

        .method-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
            gap: 16px;
        }

        article {
            overflow: hidden;
            padding: 19px;
            border: 1px solid #e0e7f1;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 5px 18px rgb(34 54 88 / 6%);
        }

        h3 {
            margin: 0 0 8px;
            color: #263d78;
            font-size: 1.12rem;
        }

        .description {
            min-height: 3.2em;
            margin: 0;
            color: #52617a;
            line-height: 1.6;
        }

        .example {
            margin: 12px 0 0;
            padding: 9px 11px;
            border-radius: 8px;
            background: #f2f5fb;
            color: #33425e;
            font-size: 0.92rem;
            overflow-wrap: anywhere;
        }

        .example output {
            color: #244db8;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        figure {
            margin: 14px 0 0;
            padding: 10px;
            border-radius: 12px;
            background: #f5f8ff;
        }

        svg {
            display: block;
            width: 100%;
            height: 118px;
        }

        figcaption {
            margin-top: 5px;
            color: #52617a;
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .grid-line {
            stroke: #e2e8f2;
            stroke-width: 1;
        }

        .axis {
            stroke: #9aa8bf;
            stroke-width: 1.5;
        }

        .graph-line {
            fill: none;
            stroke: #3156c9;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
        }

        .moving-dot {
            fill: #f4a340;
            stroke: #fff;
            stroke-width: 2;
        }

        .static-dot {
            display: none;
            fill: #f4a340;
            stroke: #fff;
            stroke-width: 2;
        }

        .marker {
            fill: #8797b0;
        }

        .marker.highlight {
            fill: #f4a340;
        }

        .svg-label {
            fill: #52617a;
            font-family: inherit;
            font-size: 11px;
        }

        @media (prefers-reduced-motion: reduce) {
            .moving-dot {
                display: none;
            }

            .static-dot {
                display: block;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 28px 14px;
            }

            article {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>JavaScript Math 메소드</h1>
        <p>각 메소드가 어떤 계산을 하는지 예제와 그림으로 살펴보세요. 그래프의 주황색 점은 선을 따라 움직이며, 그래프를 읽는 데 도움을 줍니다. 각도 계산 결과는 라디안 단위입니다.</p>
    </header>

    <section aria-labelledby="group-one-title">
        <h2 class="section-title" id="group-one-title">메소드 1 · 절댓값, 로그, 각도, 올림</h2>
        <div class="method-list" id="group-one"></div>
    </section>
    <section aria-labelledby="group-two-title">
        <h2 class="section-title" id="group-two-title">메소드 2 · 삼각함수, 지수, 범위, 거듭제곱</h2>
        <div class="method-list" id="group-two"></div>
    </section>
    <section aria-labelledby="group-three-title">
        <h2 class="section-title" id="group-three-title">메소드 3 · 반올림, 제곱근, 쌍곡선 함수</h2>
        <div class="method-list" id="group-three"></div>
    </section>
</main>

<script>
    const graphWidth = 300;
    const graphHeight = 118;
    const plotLeft = 24;
    const plotRight = 276;
    const plotTop = 13;
    const plotBottom = 96;
    const graphFunctions = {
        abs: Math.abs,
        acos: Math.acos,
        acosh: Math.acosh,
        asin: Math.asin,
        asinh: Math.asinh,
        atan: Math.atan,
        cbrt: Math.cbrt,
        ceil: Math.ceil,
        cos: Math.cos,
        cosh: Math.cosh,
        exp: Math.exp,
        floor: Math.floor,
        log: Math.log,
        pow: Math.pow,
        round: Math.round,
        sin: Math.sin,
        sinh: Math.sinh,
        sqrt: Math.sqrt,
        tan: Math.tan,
        tanh: Math.tanh,
        trunc: Math.trunc
    };

    const methods = [
        {
            group: 1, name: "Math.abs(x)", input: "x = -3", value: Math.abs(-3),
            description: "절댓값을 구합니다. 숫자가 0에서 얼마나 떨어져 있는지 나타내며, 결과는 음수가 아닙니다.",
            kind: "curve", fn: "abs", min: -3, max: 3, caption: "음수도 양수도 0으로부터의 거리는 양수입니다."
        },
        {
            group: 1, name: "Math.acos(x)", input: "x = 0.5", value: Math.acos(0.5),
            description: "코사인 값 x에 해당하는 각도를 라디안으로 구합니다. 입력값은 -1부터 1까지입니다.",
            kind: "curve", fn: "acos", min: -1, max: 1, caption: "cos(각도) = x일 때, acos(x)는 그 각도를 되찾습니다."
        },
        {
            group: 1, name: "Math.acosh(x)", input: "x = 2", value: Math.acosh(2),
            description: "쌍곡선 코사인의 역함수입니다. 1 이상의 입력에서 결과를 구합니다.",
            kind: "curve", fn: "acosh", min: 1, max: 4, caption: "입력 x가 1보다 작으면 실수 결과를 얻을 수 없습니다."
        },
        {
            group: 1, name: "Math.asin(x)", input: "x = 0.5", value: Math.asin(0.5),
            description: "사인 값 x에 해당하는 각도를 라디안으로 구합니다. 입력값은 -1부터 1까지입니다.",
            kind: "curve", fn: "asin", min: -1, max: 1, caption: "sin(각도) = x일 때, asin(x)는 그 각도를 되찾습니다."
        },
        {
            group: 1, name: "Math.asinh(x)", input: "x = 1", value: Math.asinh(1),
            description: "쌍곡선 사인의 역함수입니다. 모든 실수 입력을 처리할 수 있습니다.",
            kind: "curve", fn: "asinh", min: -3, max: 3, caption: "입력과 출력이 함께 증가하는 역함수 그래프입니다."
        },
        {
            group: 1, name: "Math.atan(x)", input: "x = 1", value: Math.atan(1),
            description: "탄젠트 값 x에 해당하는 각도를 라디안으로 구합니다. 결과는 -π/2와 π/2 사이입니다.",
            kind: "curve", fn: "atan", min: -5, max: 5, caption: "입력이 커져도 결과 각도는 -π/2와 π/2 사이에 머뭅니다."
        },
        {
            group: 1, name: "Math.atan2(y, x)", input: "y = 1, x = 3", value: Math.atan2(1, 3),
            description: "좌표 (x, y)의 방향 각도를 구합니다. 두 좌표의 부호를 모두 살펴 사분면도 구분합니다.",
            kind: "angle", caption: "원점에서 (3, 1)로 향하는 방향의 각도를 나타냅니다."
        },
        {
            group: 1, name: "Math.cbrt(x)", input: "x = -8", value: Math.cbrt(-8),
            description: "세제곱해서 x가 되는 수를 구합니다. 음수의 세제곱근도 계산할 수 있습니다.",
            kind: "curve", fn: "cbrt", min: -8, max: 8, caption: "출력값을 세 번 곱하면 다시 입력값이 됩니다."
        },
        {
            group: 1, name: "Math.ceil(x)", input: "x = 2.3", value: Math.ceil(2.3),
            description: "x보다 크거나 같은 가장 작은 정수를 구합니다. 소수점이 있으면 위쪽 정수로 올립니다.",
            kind: "curve", fn: "ceil", min: -3, max: 3, caption: "계단 모양의 그래프처럼 각 구간의 값을 위쪽 정수로 맞춥니다."
        },
        {
            group: 2, name: "Math.cos(x)", input: "x = 1 rad", value: Math.cos(1),
            description: "각도 x의 코사인 값을 구합니다. 각도는 라디안으로 전달하며 파동처럼 반복됩니다.",
            kind: "curve", fn: "cos", min: -Math.PI * 2, max: Math.PI * 2, caption: "코사인 곡선은 2π마다 같은 모양을 반복합니다."
        },
        {
            group: 2, name: "Math.cosh(x)", input: "x = 1", value: Math.cosh(1),
            description: "x의 쌍곡선 코사인 값을 구합니다. 그래프는 y축을 기준으로 좌우 대칭입니다.",
            kind: "curve", fn: "cosh", min: -2, max: 2, caption: "cosh(x)는 x와 -x에서 같은 값을 갖습니다."
        },
        {
            group: 2, name: "Math.exp(x)", input: "x = 1", value: Math.exp(1),
            description: "오일러 수 e를 x만큼 거듭제곱한 값을 구합니다. Math.exp(x)는 e의 x제곱입니다.",
            kind: "curve", fn: "exp", min: -2, max: 2, caption: "x가 증가할수록 값이 빠르게 커지는 지수 그래프입니다."
        },
        {
            group: 2, name: "Math.floor(x)", input: "x = 2.8", value: Math.floor(2.8),
            description: "x보다 작거나 같은 가장 큰 정수를 구합니다. 소수점 아래를 버리고 아래쪽 정수로 내립니다.",
            kind: "curve", fn: "floor", min: -3, max: 3, caption: "계단 모양의 그래프처럼 각 구간의 값을 아래쪽 정수로 맞춥니다."
        },
        {
            group: 2, name: "Math.log(x)", input: "x = Math.E", value: Math.log(Math.E),
            description: "x의 자연로그를 구합니다. e를 몇 제곱해야 x가 되는지 나타냅니다. x는 양수여야 합니다.",
            kind: "curve", fn: "log", min: 0.1, max: 5, caption: "Math.log(Math.E)는 1입니다. 입력값은 0보다 커야 합니다."
        },
        {
            group: 2, name: "Math.max(x, ...)", input: "값 = 1, 3, 0.3, 12", value: Math.max(1, 3, 0.3, 12),
            description: "여러 숫자 중 가장 큰 값을 반환합니다. 비교할 숫자를 쉼표로 나열합니다.",
            kind: "number", values: [1, 3, 0.3, 12], highlight: 12, caption: "여러 후보 중 가장 큰 값 12를 찾습니다."
        },
        {
            group: 2, name: "Math.min(x, ...)", input: "값 = 1, 3, 0.3, 12", value: Math.min(1, 3, 0.3, 12),
            description: "여러 숫자 중 가장 작은 값을 반환합니다. 비교할 숫자를 쉼표로 나열합니다.",
            kind: "number", values: [1, 3, 0.3, 12], highlight: 0.3, caption: "여러 후보 중 가장 작은 값 0.3을 찾습니다."
        },
        {
            group: 2, name: "Math.pow(x, y)", input: "x = 2, y = 3", value: Math.pow(2, 3),
            description: "x를 y제곱한 값을 구합니다. 예를 들어 2의 3제곱은 2를 세 번 곱한 8입니다.",
            kind: "curve", fn: "pow", power: 3, min: -2, max: 2, caption: "이 예제의 그래프는 y = x³이며, 입력을 세 번 곱한 결과입니다."
        },
        {
            group: 2, name: "Math.random()", input: "결과 범위 = 0 이상 1 미만", value: Math.random(),
            description: "0 이상 1 미만의 의사 난수를 반환합니다. 호출할 때마다 다른 값이 나올 수 있습니다.",
            kind: "number", values: [0, 0.25, 0.5, 0.75, 1], highlight: null, caption: "움직이는 점은 0 이상 1 미만의 결과 범위를 보여줍니다."
        },
        {
            group: 3, name: "Math.round(x)", input: "x = 2.5", value: Math.round(2.5),
            description: "가장 가까운 정수로 반올림합니다. 정확히 중간이면 JavaScript에서는 양의 무한대 방향으로 올립니다.",
            kind: "curve", fn: "round", min: -3, max: 3, caption: "예를 들어 2.5는 3, -2.5는 -2가 됩니다."
        },
        {
            group: 3, name: "Math.sin(x)", input: "x = π/2 rad", value: Math.sin(Math.PI / 2),
            description: "각도 x의 사인 값을 구합니다. 각도는 라디안으로 전달하며 주기적으로 반복됩니다.",
            kind: "curve", fn: "sin", min: -Math.PI * 2, max: Math.PI * 2, caption: "사인 곡선은 2π마다 같은 모양을 반복합니다."
        },
        {
            group: 3, name: "Math.sinh(x)", input: "x = 1", value: Math.sinh(1),
            description: "x의 쌍곡선 사인 값을 구합니다. 입력이 양수면 양수, 음수면 음수가 됩니다.",
            kind: "curve", fn: "sinh", min: -2, max: 2, caption: "원점을 중심으로 대칭인 쌍곡선 함수 그래프입니다."
        },
        {
            group: 3, name: "Math.sqrt(x)", input: "x = 9", value: Math.sqrt(9),
            description: "제곱해서 x가 되는 0 이상의 값을 구합니다. 음수의 제곱근은 실수로 반환되지 않습니다.",
            kind: "curve", fn: "sqrt", min: 0, max: 9, caption: "출력값을 제곱하면 다시 입력값이 됩니다."
        },
        {
            group: 3, name: "Math.tan(x)", input: "x = π/4 rad", value: Math.tan(Math.PI / 4),
            description: "각도 x의 탄젠트 값을 구합니다. 각도는 라디안이며, π/2에 가까운 곳에서 값이 크게 변합니다.",
            kind: "curve", fn: "tan", min: -1.35, max: 1.35, caption: "π/2와 -π/2 부근에서는 그래프가 급격히 커집니다."
        },
        {
            group: 3, name: "Math.tanh(x)", input: "x = 1", value: Math.tanh(1),
            description: "x의 쌍곡선 탄젠트 값을 구합니다. 결과는 -1보다 크고 1보다 작습니다.",
            kind: "curve", fn: "tanh", min: -4, max: 4, caption: "입력이 커질수록 값은 1에, 작아질수록 -1에 가까워집니다."
        },
        {
            group: 3, name: "Math.trunc(x)", input: "x = -2.8", value: Math.trunc(-2.8),
            description: "소수점 아래를 버리고 정수 부분만 남깁니다. 0을 향해 버리므로 음수도 구분해야 합니다.",
            kind: "curve", fn: "trunc", min: -3, max: 3, caption: "-2.8은 -2가 됩니다. floor(-2.8)의 -3과 다릅니다."
        }
    ];

    function formatNumber(value) {
        if (!Number.isFinite(value)) {
            return String(value);
        }
        if (Number.isInteger(value)) {
            return String(value);
        }
        return value.toFixed(5).replace(/0+$/, "").replace(/\.$/, "");
    }

    function mapX(value, min, max) {
        return plotLeft + (value - min) / (max - min) * (plotRight - plotLeft);
    }

    function mapY(value, min, max) {
        return plotBottom - (value - min) / (max - min) * (plotBottom - plotTop);
    }

    function curveValue(method, x) {
        if (method.fn === "pow") {
            return Math.pow(x, method.power);
        }
        return graphFunctions[method.fn](x);
    }

    function curvePoints(method) {
        const points = [];
        const steps = 180;
        for (let i = 0; i <= steps; i += 1) {
            const x = method.min + (method.max - method.min) * i / steps;
            const y = curveValue(method, x);
            if (!Number.isFinite(y)) {
                continue;
            }
            points.push([x, y]);
        }
        const values = points.map(([, y]) => y);
        let minY = Math.min(...values);
        let maxY = Math.max(...values);
        const padding = Math.max((maxY - minY) * 0.08, 0.1);
        minY -= padding;
        maxY += padding;
        const plotted = points.map(([x, y]) => [
            mapX(x, method.min, method.max),
            mapY(y, minY, maxY)
        ]);
        return {
            minY,
            maxY,
            plotted,
            path: plotted.map(([x, y], index) => `${index === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`).join(" ")
        };
    }

    function axisMarkup(method, minY, maxY) {
        const horizontalAxis = minY <= 0 && maxY >= 0
            ? `<path class="axis" d="M${plotLeft} ${mapY(0, minY, maxY)}H${plotRight}"/>`
            : "";
        const verticalAxis = method.min <= 0 && method.max >= 0
            ? `<path class="axis" d="M${mapX(0, method.min, method.max)} ${plotTop}V${plotBottom}"/>`
            : "";
        return `<path class="grid-line" d="M${plotLeft} 30H${plotRight} M${plotLeft} 78H${plotRight}"/>
            ${horizontalAxis}${verticalAxis}`;
    }

    function staticDot(pathStart) {
        return `<circle class="static-dot" cx="${pathStart[0]}" cy="${pathStart[1]}" r="6"/>`;
    }

    function makeGraph(method, index) {
        const id = `graph-path-${index}`;
        if (method.kind === "angle") {
            const start = [185, 60];
            const path = "M185 60 A35 35 0 0 0 183.2 49";
            return `<svg viewBox="0 0 ${graphWidth} ${graphHeight}" role="img" aria-label="좌표 평면에서 x축의 양의 방향부터 점을 향해 움직이는 각도 그래프">
                <path class="grid-line" d="M35 60H265 M150 12V106"/>
                <path class="axis" d="M35 60H265 M150 12V106"/>
                <path class="graph-line" d="M150 60L210 40"/>
                <path class="graph-line" d="${path}" id="${id}"/>
                <circle class="marker" cx="210" cy="40" r="4"/>
                <text class="svg-label" x="217" y="42">(3, 1)</text>
                <text class="svg-label" x="181" y="77">θ</text>
                ${staticDot(start)}
                <circle class="moving-dot" r="6"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>
            </svg>`;
        }
        if (method.kind === "number") {
            const start = [plotLeft, 60];
            const path = `M${plotLeft} 60H${plotRight}`;
            const min = 0;
            const max = method.name === "Math.random()" ? 1 : 12;
            const markers = method.values.map((value) => {
                const x = mapX(value, min, max);
                const highlight = method.highlight === value ? " highlight" : "";
                const label = formatNumber(value);
                return `<circle class="marker${highlight}" cx="${x.toFixed(2)}" cy="60" r="${method.highlight === value ? 5 : 3.5}"/>
                    <text class="svg-label" x="${x.toFixed(2)}" y="47" text-anchor="middle">${label}</text>`;
            }).join("");
            return `<svg viewBox="0 0 ${graphWidth} ${graphHeight}" role="img" aria-label="${method.caption}">
                <path class="axis" d="M${plotLeft} 60H${plotRight}"/>
                <path class="graph-line" d="${path}" id="${id}"/>
                ${markers}
                <text class="svg-label" x="${plotLeft}" y="82" text-anchor="middle">작은 값</text>
                <text class="svg-label" x="${plotRight}" y="82" text-anchor="middle">${method.name === "Math.random()" ? "1 미만" : "큰 값"}</text>
                ${staticDot(start)}
                <circle class="moving-dot" r="6"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>
            </svg>`;
        }

        const curve = curvePoints(method);
        const pathStart = curve.plotted[0];
        return `<svg viewBox="0 0 ${graphWidth} ${graphHeight}" role="img" aria-label="${method.caption}">
            ${axisMarkup(method, curve.minY, curve.maxY)}
            <path class="graph-line" d="${curve.path}" id="${id}"/>
            ${staticDot(pathStart)}
            <circle class="moving-dot" r="6"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>
        </svg>`;
    }

    methods.forEach((method, index) => {
        const container = document.getElementById(`group-${["one", "two", "three"][method.group - 1]}`);
        const article = document.createElement("article");
        const value = method.fn === "random" ? formatNumber(method.value) : formatNumber(method.value);
        article.innerHTML = `<h3>${method.name}</h3>
            <p class="description">${method.description}</p>
            <p class="example">${method.input} → <output>${value}</output></p>
            <figure>${makeGraph(method, index)}<figcaption>${method.caption}</figcaption></figure>`;
        container.append(article);
    });
</script>
</body>
</html>
