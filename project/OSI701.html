world.appendChild(h('div',{class:'ln',style:'left:'+(-420*GX)+'px;width:'+(840*GX)+'px'}));world.appendChild(pk);apply3D();}
function u3(){const st=STEPS[S.step];for(const k in BOX)BOX[k].classList.remove('sel');
if(!st){pk.classList.remove('on');return;}BOX[st[0]+st[1]].classList.add('sel');const nd=NODES.find(n=>n[0]===st[0]);
pk.style.transform='translate3d('+nd[3]*GX+'px,'+(-(st[1]-1)*36)+'px,34px)';pk.classList.add('on');}
sc.addEventListener('pointerdown',e=>{if(e.target.id==='bView')return;drag={x:e.clientX,y:e.clientY,rx:V3.rx,ry:V3.ry};moved=false;});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(!moved)return;V3.ry=drag.ry+dx*.3;V3.rx=Math.max(-70,Math.min(10,drag.rx+dy*.3));apply3D();});
window.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>{moved=false;},0);});
$('bView').onclick=()=>{V3.rx=-20;V3.ry=-14;apply3D();};window.addEventListener('resize',()=>{const g=sc.clientWidth<700?.6:1;if(g!==GX){GX=g;world.textContent='';build3D();u3();}else apply3D();});
/* ===== 상태 변경 ===== */
function selectVulnerability(n,i){S.vi=i;renderSecurityReport(n);updateSecurityFeedback(n,S.mode);const b=$('rep').querySelectorAll('[aria-label="취약점 선택"] button')[i];if(b)b.focus();}
function setSecurityMode(m){S.mode=m;renderSecurityReport(S.layer);updateSecurityFeedback(S.layer,m);const b=$('rep').querySelector(m==='attack'?'.mA':'.mD');if(b)b.focus();}
function go(i){S.step=i;S.layer=i<0?0:STEPS[i][1];S.vi=0;updateLayerSummary(S.layer);u3();renderSecurityReport(S.layer);updateSecurityFeedback(S.layer,S.mode);}
function stop(){clearInterval(S.timer);S.timer=null;$('bAuto').setAttribute('aria-pressed','false');$('bAuto').textContent='자동 재생';}
function next(){if(S.step<STEPS.length-1)go(S.step+1);else stop();}
$('bNext').onclick=()=>{stop();next();};$('bPrev').onclick=()=>{stop();if(S.step>0)go(S.step-1);};
$('bReset').onclick=()=>{stop();S.mode='attack';go(-1);};
$('bAuto').onclick=()=>{if(S.timer){stop();return;}$('bAuto').setAttribute('aria-pressed','true');$('bAuto').textContent='정지';next();S.timer=setInterval(()=>{if(S.step>=STEPS.length-1)stop();else next();},1800);};
GX=sc.clientWidth<700?.6:1;build3D();go(-1);
})();
</script></body></html>
