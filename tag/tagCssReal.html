<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연결 페이지</title>
<style>
  :root {
    --bg-deep: #0b1220;
    --bg-panel: #101b31;
    --line: #1f2c47;
    --text-main: #e6ebf5;
    --text-dim: #8593ad;
    --accent: #4f7cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 0%, #132445 0%, var(--bg-deep) 60%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  .eyebrow {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 12px;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 40px;
    letter-spacing: -0.01em;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    text-decoration: none;
    color: var(--text-main);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  a.card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card-label {
    font-size: 17px;
    font-weight: 500;
  }

  .card-arrow {
    color: var(--accent);
    font-size: 18px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    a.card { padding: 18px 20px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">바로가기</p>
    <h1>이동할 페이지를 선택하세요</h1>
    <div class="links">
      <a class="card" href="tagCss.html">
        <span class="card-label">1학기</span>
        <span class="card-arrow">›</span>
      </a>
      <a class="card" href="tagCss2.html">
        <span class="card-label">2학기</span>
        <span class="card-arrow">›</span>
      </a>
    </div>
  </div>
</body>
</html>
